services:
  web:
    build:
      context: ..
      dockerfile: .docker/Dockerfile

    container_name: my-portfolio

    restart: unless-stopped

    env_file:
      - ../.env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod

    ports:
      - "127.0.0.1:8007:8000"

    networks:
      - gis_centralize_db

networks:
  gis_centralize_db:
    external: true
    name: gis_centralize_db